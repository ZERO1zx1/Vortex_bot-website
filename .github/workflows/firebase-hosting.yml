# Deploy website to Firebase Hosting on pushes to main
name: Deploy to Firebase Hosting

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The website is a Vite/React app: `website/dist` is produced by the
      # build and is gitignored, so it does not exist in a fresh checkout.
      # The deploy action does NOT build for us — the build must run here.
      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build website
        run: npm run build
        working-directory: website

      - name: Verify build output
        run: test -f dist/index.html
        working-directory: website

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AETHER_C1915 }}"
          projectId: aether-c1915
          target: aether
          channelId: live
