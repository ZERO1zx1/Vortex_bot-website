name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Unicode fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements.txt pytest pytest-asyncio==1.4.0
      - name: Compile Python sources
        run: python -m compileall -q main.py config_manager.py cogs database utils backend
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Validate website command catalog
        working-directory: website
        run: node validate_commands.js
