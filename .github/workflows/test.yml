name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aether_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AETHER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/aether_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Unicode fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio==1.4.0 "psycopg[binary]>=3.2"
      - name: Compile Python sources
        run: python -m compileall -q src tools
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Validate website command catalog
        working-directory: website
        run: node tools/validate_commands.js
