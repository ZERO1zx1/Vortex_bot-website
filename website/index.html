    <script>
      /* Apply the stored theme before first paint so a light-mode user never
       sees a dark flash. Mirrors the logic in useTheme. */
      (function () {
        try {
          var saved = localStorage.getItem("aether-theme");
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : prefersLight
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "light") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#F7F9FC");
          }
        } catch (e) {
          /* private mode */
        }
      })();
    </script>
