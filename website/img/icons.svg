<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Icon symbols for 𝓐𝓮𝓽𝓱𝓮𝓻 蒼穹 — refined 2-tone set (stroke + soft fill accent) -->
  <defs>
    <style>
      .stroke { stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-only { stroke: none; }
    </style>
    <!-- soft gradient fills for the accent shapes -->
    <radialGradient id="g-econ" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#A6E3A1" stop-opacity="0.55"/><stop offset="100%" stop-color="#A6E3A1" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-lvl" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#89B4FA" stop-opacity="0.55"/><stop offset="100%" stop-color="#89B4FA" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-love" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#FAB387" stop-opacity="0.55"/><stop offset="100%" stop-color="#FAB387" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-shop" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#F38BA8" stop-opacity="0.55"/><stop offset="100%" stop-color="#F38BA8" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-cas" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#B392F0" stop-opacity="0.55"/><stop offset="100%" stop-color="#B392F0" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-maf" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#F5C2E7" stop-opacity="0.55"/><stop offset="100%" stop-color="#F5C2E7" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-mod" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#94E2D5" stop-opacity="0.55"/><stop offset="100%" stop-color="#94E2D5" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="g-fun" cx="50%" cy="30%" r="70%"><stop offset="0%" stop-color="#F9E2AF" stop-opacity="0.55"/><stop offset="100%" stop-color="#F9E2AF" stop-opacity="0.12"/></radialGradient>
  </defs>

  <symbol id="economy" viewBox="0 0 64 64">
    <g class="stroke" stroke="#A6E3A1">
      <ellipse cx="32" cy="44" rx="21" ry="7" fill="url(#g-econ)"/>
      <ellipse cx="32" cy="44" rx="21" ry="7"/>
      <ellipse cx="32" cy="33" rx="21" ry="7"/>
      <ellipse cx="32" cy="22" rx="21" ry="7"/>
      <text x="32" y="36" text-anchor="middle" font-size="15" font-weight="800" font-family="serif" fill="#A6E3A1" stroke="none">₮</text>
    </g>
  </symbol>

  <symbol id="leveling" viewBox="0 0 64 64">
    <g class="stroke" stroke="#89B4FA">
      <rect x="13" y="40" width="10" height="14" rx="2" fill="url(#g-lvl)"/>
      <rect x="27" y="29" width="10" height="25" rx="2" fill="url(#g-lvl)"/>
      <rect x="41" y="16" width="10" height="38" rx="2" fill="url(#g-lvl)"/>
      <path d="M48 16l6-6M54 10h-6v6" stroke-width="5"/>
    </g>
  </symbol>

  <symbol id="marriage" viewBox="0 0 64 64">
    <g class="stroke" stroke="#FAB387">
      <path d="M32 50C21 41 10 35 10 25a10 10 0 0 1 19-4 10 10 0 0 1 25 4c0 10-11 16-22 25z" fill="url(#g-love)"/>
      <path d="M26 30h4v5a5 5 0 0 0 4 5v0a5 5 0 0 0 4-5v-5h4v8" stroke-width="4.5"/>
    </g>
  </symbol>

  <symbol id="shop" viewBox="0 0 64 64">
    <g class="stroke" stroke="#F38BA8">
      <path d="M12 24h40l-3 28a4 4 0 0 1-4 4H19a4 4 0 0 1-4-4z" fill="url(#g-shop)"/>
      <path d="M18 24V16h28v8" stroke-width="4"/>
      <path d="M27 24v-8a5 5 0 0 1 10 0v8" stroke-width="4"/>
      <rect x="28" y="40" width="8" height="16" rx="2"/>
    </g>
  </symbol>

  <symbol id="casino" viewBox="0 0 64 64">
    <g class="stroke" stroke="#B392F0">
      <rect x="14" y="14" width="36" height="36" rx="8" transform="rotate(12 32 32)" fill="url(#g-cas)"/>
      <rect x="14" y="14" width="36" height="36" rx="8" transform="rotate(12 32 32)"/>
      <circle cx="25" cy="22" r="3" class="fill-only" fill="#B392F0"/>
      <circle cx="40" cy="42" r="3" class="fill-only" fill="#B392F0"/>
      <circle cx="30" cy="32" r="3" class="fill-only" fill="#B392F0"/>
    </g>
  </symbol>

  <symbol id="mafia" viewBox="0 0 64 64">
    <g class="stroke" stroke="#F5C2E7">
      <path d="M12 44c0-6 4-12 10-12h20c6 0 10 6 10 12" fill="url(#g-maf)"/>
      <path d="M12 44h40v5H12z" fill="url(#g-maf)"/>
      <path d="M14 44c6-4 13-18 18-20 5 2 12 16 18 20" stroke-width="4"/>
      <path d="M22 44v4M42 44v4" stroke-width="4"/>
    </g>
  </symbol>

  <symbol id="moderation" viewBox="0 0 64 64">
    <g class="stroke" stroke="#94E2D5">
      <path d="M32 8 50 15v13c0 11-8 18-18 22-10-4-18-11-18-22V15z" fill="url(#g-mod)"/>
      <path d="M25 32l5 5 11-11" stroke-width="5"/>
    </g>
  </symbol>

  <symbol id="fun" viewBox="0 0 64 64">
    <g class="stroke" stroke="#F9E2AF">
      <path d="M10 52l18-18" stroke-width="6"/>
      <path d="M26 10c8-2 14 4 12 12l-4 12-12 4c-8 2-14-4-12-12z" fill="url(#g-fun)"/>
      <path d="M26 10c8-2 14 4 12 12l-4 12-12 4c-8 2-14-4-12-12z"/>
      <path d="M46 14l6-6M52 24l8-2M48 36l6 4" stroke-width="4"/>
    </g>
  </symbol>

  <!-- utility icons (unchanged) -->
  <symbol id="status" viewBox="0 0 64 64">
    <g class="stroke" stroke="#94E2D5"><circle cx="32" cy="48" r="4" fill="#94E2D5" class="fill-only"/><path d="M22 38a14 14 0 0 1 20 0M15 31a24 24 0 0 1 34 0" stroke-width="5"/></g>
  </symbol>
  <symbol id="about" viewBox="0 0 64 64">
    <g class="stroke" stroke="#89B4FA"><path d="M22 18l-12 14 12 14" stroke-width="5"/><path d="M42 18l12 14-12 14" stroke-width="5"/><path d="M30 44l8-16" stroke="#F38BA8" stroke-width="5"/></g>
  </symbol>
  <symbol id="premium" viewBox="0 0 64 64">
    <g class="stroke" stroke="#FAB387"><path d="M10 52V24l11 10 11-20 11 20 11-10v28z" fill="rgba(250,179,135,0.18)"/><path d="M10 52h44" stroke-width="5"/><circle cx="32" cy="18" r="3" class="fill-only" fill="#FAB387"/></g>
  </symbol>
  <symbol id="invite" viewBox="0 0 64 64">
    <g class="stroke" stroke="#89B4FA"><path d="M32 10c-8 8-12 18-12 30h14v12c0 3 4 3 4 0V40h14c0-12-4-22-12-30z" fill="rgba(137,180,250,0.15)"/><path d="M20 40l-8 14 14-8M44 40l8 14-14-8"/><circle cx="32" cy="28" r="4"/></g>
  </symbol>
</svg>
